[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-memory-long-context-bench"
version = "0.1.0"
description = "Synthetic long-context benchmark dataset generator for memory systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentic-memory @ git+https://github.com/agentclash/agentic-memory.git",
    "google-genai>=1.68.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
generate-long-context-dataset = "agentic_memory_long_context_bench.generator:main"
run-long-context-harness = "agentic_memory_long_context_bench.runner:main"
generate-benchmark-report = "agentic_memory_long_context_bench.reporting:main"

[tool.setuptools.packages.find]
where = ["src"]
